name: WebVM

options:
  bundleIdPrefix: app.ish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "KTGSS9PB3A"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  # Off-the-shelf embedded HTTP server. Remote SwiftPM dep, pinned to match w-shell.
  Telegraph:
    url: https://github.com/Building42/Telegraph.git
    exactVersion: 0.40.0

targets:
  WebVM:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"   # referenced via INFOPLIST_FILE; keep out of compile sources
      # Staged WebVM build + disk image, shipped as a FOLDER REFERENCE so JS
      # dynamic-import sub-paths and /disk/*.ext2 survive verbatim in the bundle.
      - path: web/webroot
        type: folder
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist   # do NOT use `info:` — it would regenerate and clobber ATS keys
        PRODUCT_BUNDLE_IDENTIFIER: app.ish.iSH.KTGSS9PB3A
        PRODUCT_NAME: WebVM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # actool injects CFBundleIconName + sizes (required by TestFlight)
    dependencies:
      - package: Telegraph
        product: Telegraph

schemes:
  WebVM:
    build:
      targets:
        WebVM: all
    run:
      config: Debug
